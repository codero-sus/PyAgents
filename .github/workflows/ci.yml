name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show environment
        run: |
          python --version
          python -m pip list

      - name: Tests
        # The suite is fully offline: providers are exercised through
        # FakeTransport / ScriptedProvider / the echo provider.
        run: python -m pytest tests -q

      - name: Tests with coverage (3.11 only)
        if: matrix.python-version == '3.11'
        run: python -m pytest tests -q --cov=pyagents --cov-report=term-missing

  lint:
    name: lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: python -m ruff check src tests examples

      - name: Ruff (format)
        run: python -m ruff format --check src tests examples

      - name: Mypy
        run: python -m mypy

      - name: Examples run offline
        run: |
          for example in examples/0*.py; do
            echo "::group::$example"
            python "$example"
            echo "::endgroup::"
          done
        env:
          # Never let a stray credential make the examples hit a real API.
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          PYAGENTS_PROVIDER: ""

  cli:
    name: packaging & cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel and smoke-test the CLI
        run: |
          python -m pip install dist/*.whl
          pyagents --version
          pyagents info
          pyagents providers
          pyagents tools list
          pyagents run "hello from CI" --provider echo --no-stream
          pyagents run "hello" --provider echo --store runs.sqlite3 --quiet
          pyagents runs list --store runs.sqlite3

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build the documentation
        run: mkdocs build --strict
