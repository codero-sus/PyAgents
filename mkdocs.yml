site_name: PyAgents
site_description: An async-first framework for building multi-agent LLM applications in Python.
site_url: https://codero-sus.github.io/PyAgents/
repo_url: https://github.com/codero-sus/PyAgents
repo_name: codero-sus/PyAgents
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Guides:
      - Agents: agents.md
      - Tools: tools.md
      - Multi-agent patterns: multi-agent.md
      - Memory & state: memory-and-state.md
      - Providers: providers.md
      - Command line: cli.md
      - Testing agents: testing.md
  - API reference: api.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # Import the package straight from the checkout (src layout) so the
          # docs build works without installing PyAgents first.
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true
            merge_init_into_class: true

watch:
  - src/pyagents
